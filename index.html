<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickTicket - Online Ticket Booking</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>🎟️ QuickTicket</h1>
        <p>Online Ticket Booking Simulation</p>
    </header>

    <div class="container">

        <!-- Banner Advertisement -->
        <div class="ad-banner" id="mainAd">
            <span>ADVERTISEMENT</span>
            <h2>🔥 Get 20% OFF on Your Next Trip!</h2>
            <p>Book your tickets today and save more.</p>
        </div>

        <!-- Booking Section -->
        <div class="booking-card">

            <h2>Book Your Ticket</h2>

            <div class="form-row">

                <div class="form-group">
                    <label for="from">From</label>
                    <input
                        type="text"
                        id="from"
                        placeholder="Enter departure city"
                    >
                </div>

                <div class="form-group">
                    <label for="to">To</label>
                    <input
                        type="text"
                        id="to"
                        placeholder="Enter destination"
                    >
                </div>

            </div>

            <div class="form-row">

                <div class="form-group">
                    <label for="date">Travel Date</label>
                    <input type="date" id="date">
                </div>

                <div class="form-group">
                    <label for="passengers">Passengers</label>

                    <select id="passengers">
                        <option value="1">1 Passenger</option>
                        <option value="2">2 Passengers</option>
                        <option value="3">3 Passengers</option>
                        <option value="4">4 Passengers</option>
                    </select>
                </div>

            </div>

            <button onclick="bookTicket()">
                Search & Book
            </button>

            <!-- Sponsored Advertisement -->
            <div class="sponsored-ad">

                <span>SPONSORED</span>

                <h3>💳 Special Payment Offer</h3>

                <p>
                    Get ₹100 cashback when you pay using our
                    partner payment service.
                </p>

                <button onclick="sponsoredAdClick()">
                    View Offer
                </button>

            </div>

            <!-- Booking Result -->
            <div id="result"></div>

            <!-- Advertisement Statistics -->
            <div class="ad-stats">
                <p>
                    Ad Impressions:
                    <strong id="impressions">0</strong>
                </p>

                <p>
                    Ad Clicks:
                    <strong id="clicks">0</strong>
                </p>
            </div>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
